name: Metro APK

# Builds an installable debug APK of the Metro launcher on every push to the
# metro branch (or on demand from the Actions tab). Download it from the run's
# "Artifacts" section.

on:
  push:
    branches:
      - 'metro'
      - 'metro-*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: metro-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Use a fixed debug key so each new APK installs over the previous one
      # instead of failing with a signature mismatch.
      - name: Install fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp metro/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew assembleLawnWithQuickstepGithubDebug --stacktrace 2>&1 | tee build.log

      # Surface compiler errors as annotations, readable without downloading the log.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|\.(kt|java):[0-9]+: error" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metro-launcher-debug
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Publish to a rolling "metro-latest" pre-release so the newest APK is
      # always one tap away on the phone (Releases page of the repo).
      - name: Publish to metro-latest release
        if: github.ref == 'refs/heads/metro'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find build/outputs/apk -name '*.apk' | head -n 1)
          cp "$APK" Metro-latest.apk
          gh release delete metro-latest --yes --cleanup-tag || true
          gh release create metro-latest Metro-latest.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Metro launcher (latest build)" \
            --notes "Debug build of ${GITHUB_SHA::7} from the metro branch. Install over the previous build; your layout is kept."
